services:
  - type: web
    name: truck-payments-server
    env: node
    region: oregon
    plan: free
    buildCommand: "cd server && npm install"
    startCommand: "cd server && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: "mongodb://127.0.0.1:27017/truck-payments"
